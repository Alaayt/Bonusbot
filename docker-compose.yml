version: "3.9"

services:
  bot:
    build: .
    env_file: .env
    depends_on:
      - redis
      - db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bonusbot
      POSTGRES_PASSWORD: bonusbot
      POSTGRES_DB: bonusbot
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  redis_data:
  db_data:
